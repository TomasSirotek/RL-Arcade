[project]
name = "rlforge"
version = "0.1.0"
description = "Plug any Gymnasium game in with a small spec, train PPO with one call."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.3,<2",
    "stable-baselines3>=2.9,<3",
    # ResizeObservation/GrayscaleObservation need cv2.
    "opencv-python>=4.9",
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.19"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
